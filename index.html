<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PRK Media CMS</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#07111f;
 color:#e8eef8;
 font-family:Arial,Helvetica,sans-serif;
}
button,input,select{font:inherit}
.app{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{
 width:245px;
 background:#091625;
 border-right:1px solid #1c2d43;
 padding:18px 12px;
 position:fixed;
 top:0;bottom:0;left:0;
 overflow:auto;
}
.logo{
 font-size:22px;
 font-weight:800;
 padding:8px 12px 24px;
 color:#fff;
}
.logo span{color:#198cff}
.section{
 font-size:11px;
 color:#687d96;
 margin:20px 10px 8px;
 letter-spacing:1px;
 font-weight:bold;
}
.nav{
 padding:11px 12px;
 border-radius:8px;
 color:#aebed1;
 margin:3px 0;
 cursor:pointer;
 display:flex;
 gap:11px;
 align-items:center;
}
.nav:hover{background:#12243a;color:#fff}
.nav.active{
 background:#147df5;
 color:#fff;
 box-shadow:0 5px 18px #147df544;
}
.badge{
 margin-left:auto;
 background:#ef3340;
 color:#fff;
 border-radius:20px;
 padding:2px 7px;
 font-size:10px;
}

/* MAIN */
.main{
 margin-left:245px;
 width:calc(100% - 245px);
 padding:18px 24px 50px;
}
.topbar{
 height:55px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 border-bottom:1px solid #1b2c42;
 margin-bottom:22px;
}
.search{
 width:430px;
 background:#0c1b2c;
 border:1px solid #20344d;
 color:#fff;
 border-radius:22px;
 padding:11px 18px;
 outline:none;
}
.profile{
 display:flex;
 gap:10px;
 align-items:center;
 font-size:14px;
}
.avatar{
 width:38px;height:38px;
 border-radius:50%;
 background:#147df5;
 display:grid;
 place-items:center;
 font-weight:bold;
}

/* PAGE TITLE */
.page-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:20px;
}
h1{margin:0;font-size:25px}
.muted{color:#7f93aa;font-size:13px}
.period{
 background:#147df5;
 border:0;
 color:#fff;
 padding:9px 15px;
 border-radius:7px;
}

/* CARDS */
.cards{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px;
}
.card{
 background:#0c1b2c;
 border:1px solid #1b3049;
 border-radius:10px;
 padding:18px;
}
.card small{color:#8ba0b8}
.card strong{
 display:block;
 font-size:27px;
 margin:9px 0;
}
.green{color:#22c77a}
.red{color:#ff4d5d}
.blue{color:#2895ff}
.yellow{color:#f5bd42}

/* GRID */
.grid{
 display:grid;
 grid-template-columns:1.6fr 1fr;
 gap:15px;
 margin-top:15px;
}
.panel{
 background:#0c1b2c;
 border:1px solid #1b3049;
 border-radius:10px;
 padding:18px;
}
.panel h3{margin:0 0 16px;font-size:16px}

/* CHART */
.chart{
 height:210px;
 display:flex;
 align-items:end;
 gap:10px;
 padding:15px 5px 0;
 border-bottom:1px solid #24384f;
}
.bar{
 flex:1;
 background:linear-gradient(#238cff,#1262d5);
 border-radius:5px 5px 0 0;
 min-height:35px;
}
.chart-label{
 display:flex;
 justify-content:space-between;
 color:#647c96;
 font-size:11px;
 margin-top:8px;
}

/* TABLE */
.table-wrap{overflow:auto}
table{
 width:100%;
 border-collapse:collapse;
 font-size:13px;
}
th,td{
 padding:13px 10px;
 text-align:left;
 border-bottom:1px solid #1b3049;
 white-space:nowrap;
}
th{color:#8196ae;font-weight:600}
.status{
 background:#073b2a;
 color:#28d58a;
 border-radius:15px;
 padding:4px 9px;
 font-size:11px;
}
.thumb{
 width:38px;height:28px;
 background:#162c46;
 border-radius:4px;
 display:inline-block;
 vertical-align:middle;
 margin-right:8px;
}

/* UPLOAD */
.upload{
 border:1px dashed #287fd5;
 background:#0b1c30;
 border-radius:10px;
 padding:30px;
 text-align:center;
}
.upload input{display:none}
.upload-btn{
 display:inline-block;
 background:#147df5;
 padding:12px 20px;
 border-radius:7px;
 color:white;
 cursor:pointer;
 margin-top:10px;
}
.file-name{margin-top:12px;color:#8da2b9}

/* CHANNELS */
.channels{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:12px;
}
.channel{
 background:#0b1a2b;
 border:1px solid #20364e;
 padding:14px;
 border-radius:8px;
}
.connected{color:#20cf80;font-size:11px}

/* DONUT */
.donut{
 width:150px;height:150px;
 border-radius:50%;
 background:conic-gradient(
 #1687ff 0 65%,
 #19c978 65% 85%,
 #ef3c4f 85% 95%,
 #68758a 95% 100%
 );
 margin:auto;
 position:relative;
}
.donut:after{
 content:"";
 position:absolute;
 width:82px;height:82px;
 background:#0c1b2c
